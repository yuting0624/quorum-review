# GitHub App manifest for quorum-review.
#
# A single shared App cannot be distributed — its private key would have to
# come with it — so each adopter creates their own. `python scripts/create_app.py`
# turns this file into an App on your account in about a minute.
#
# WHAT THIS APP IS FOR
#
# Only one thing: minting a short-lived installation token that
# `actions/create-github-app-token` hands to the workflow.
#
# It is not a service. It receives no webhooks and has no URL to run, because
# GitHub Actions already delivers the events. `default_events` is therefore
# empty and no webhook is configured — an App that listens to nothing has
# nothing to attack.
#
# WHY NOT JUST USE GITHUB_TOKEN
#
# For everything the reviewer does, you can. The reason to have an App is
# presentation: comments arrive under your App's name and avatar rather than
# "github-actions[bot]", which also means you pick both — and picking your own
# keeps this project clear of other people's trademarks.
#
# It is *not* what makes resolved threads collapse. That was the original
# reason for this file and it turned out to be wrong; see the note on
# permissions below.

name: Quorum Review
url: https://github.com/yuting0624/quorum-review
description: >-
  Cross-model pull request review on Google Cloud. Two models read each diff
  independently; where they agree, that is the result.

public: false

# No webhook: events reach the reviewer through GitHub Actions.
hook_attributes:
  active: false

default_events: []

# The smallest set that does the job.
#
#   metadata      mandatory for every App
#   contents      read the diff and .quorumignore
#   pull_requests read the pull request, post review comments
#
# Deliberately absent: `contents: write`. Nothing here pushes a commit, and
# granting it would raise the cost of a successful prompt injection from a
# wrong comment to a write against your repository.
#
# That has a cost, and it is worth knowing before you install this: **the App
# cannot collapse a resolved thread either.** `resolveReviewThread` requires
# `contents: write` — not `pull_requests: write`, which is what you would
# expect and is not enough. Measured, not documented: GitHub publishes no
# mapping from App permissions to the GraphQL API, and review threads are not
# in the REST API at all.
#
# So the choice is: threads a human closes, or a reviewer holding write access
# to the repository whose pull requests it reads. This manifest takes the
# first, because nothing here pushes a commit and the permission would buy one
# cosmetic behaviour.
#
# Change `contents` to `write` if you would rather have the second. It works —
# that is measured too. Re-approve the installation afterwards, or nothing
# changes: a permission change does not reach tokens until the owner accepts
# it, and until then the failure looks exactly like not having granted it.
default_permissions:
  metadata: read
  contents: read
  pull_requests: write
