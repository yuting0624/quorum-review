[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quorum-review"
version = "0.2.0"
description = "Cross-model pull request review on Google Cloud."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

# Deliberately small. This is a reference implementation, and a reader should be
# able to follow the whole path from a GitHub event to a posted comment without
# stepping through a framework.
dependencies = [
    "anthropic[vertex]>=0.120",
    "google-genai>=1.60",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

# The entry point is `python -m quorum_review.review`, run from a checkout of this
# repository, so the package name matches the directory rather than the project.
[tool.setuptools]
packages = ["quorum_review", "quorum_review.providers"]

# The built-in criteria are behaviour, not documentation: without them a
# `skill: security-review` resolves to nothing. They are inside the package so
# that an installed copy has them, rather than relying on the process happening
# to be running from a checkout.
[tool.setuptools.package-data]
quorum_review = ["skills/*/SKILL.md"]

[tool.ruff]
line-length = 90
target-version = "py311"
# The fixture contains deliberately defective code; linting it would report the
# very bugs it exists to hide from a linter. The harness beside it is real code
# and stays in scope.
exclude = ["benchmark/seeded-bugs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
