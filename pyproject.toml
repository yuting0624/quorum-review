[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quorum-review"
version = "0.1.0"
description = "Cross-model pull request review on Google Cloud."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

# Deliberately small. This is a reference implementation, and a reader should be
# able to follow the whole path from a GitHub event to a posted comment without
# stepping through a framework.
dependencies = [
    "anthropic[vertex]>=0.120",
    "google-genai>=1.60",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

# The entry point is `python -m src.review`, run from a checkout of this
# repository, so the package name matches the directory rather than the project.
[tool.setuptools]
packages = ["src", "src.providers"]

[tool.ruff]
line-length = 90
target-version = "py311"
# The benchmark fixture contains deliberately defective code. Linting it would
# report the very bugs the fixture exists to hide from a linter.
exclude = ["benchmark"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
