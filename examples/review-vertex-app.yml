# Same as review-vertex.yml, but comments are posted by your own GitHub App.
#
# What this buys you over the default GITHUB_TOKEN: comments arrive under a
# name and avatar you chose, instead of "github-actions[bot]".
#
# It does *not* make resolved threads collapse. That needs `contents: write`
# on the App, which the shipped manifest does not request — see
# docs/operations.md, "Resolved threads stay open".
#
# Create the App first — one command, about a minute:
#
#     python scripts/create_app.py
#
# It reads app-manifest.yml, walks you through GitHub's manifest flow, and
# tells you which secrets to set. The App receives no webhooks and runs
# nowhere; it exists only to mint short-lived tokens.

name: quorum-review

on:
  pull_request:
    types: [opened, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to review
        required: true

concurrency:
  group: >-
    quorum-review-${{ github.event.pull_request.number
      || github.event.issue.number
      || github.event.inputs.pr }}
  cancel-in-progress: ${{ github.event.comment.user.type != 'Bot' }}

# `pull-requests: write` is here even though the App token normally does the
# posting, because the fallback has to work: if the mint fails — a revoked
# installation, an expired key, an App that was never installed — the review
# runs with GITHUB_TOKEN, and without this it would then fail on the first
# comment it tried to post. A fallback that cannot do the job is not a
# fallback.
#
# `id-token: write` is for Google Cloud federation.
permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  review:
    if: >-
      github.event.pull_request.head.repo.fork != true &&
      (github.event_name == 'pull_request' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request_review_comment' &&
        github.event.comment.user.type != 'Bot' &&
        contains(github.event.comment.body, '@quorum') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
                 github.event.comment.author_association)) ||
       (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        (contains(github.event.comment.body, '@quorum /review') ||
         contains(github.event.comment.body, '@quorum /criteria')) &&
        github.event.comment.user.type != 'Bot' &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
                 github.event.comment.author_association)))
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # The `if:` above cannot exclude a fork on every trigger, and reads as
      # though it does. `github.event.pull_request` exists on `pull_request`
      # and `pull_request_review_comment` and nowhere else, so on
      # `issue_comment` and `workflow_dispatch` the field is null and
      # `null != true` passes. A maintainer typing the trigger phrase on an
      # outside contributor's pull request is an ordinary thing to do, and it
      # reached the checkout below.
      #
      # The action re-resolves fork-ness against the API and refuses, so no
      # fork gets reviewed — but that happens *after* this job has put the
      # fork's merge commit on the runner with a write-scoped token in the
      # environment. Nothing here executes the tree, which is what keeps this
      # from being serious; adding a build or a setup step would change that.
      #
      # So resolve it the same way the action does, before anything is cloned.
      # `pull-requests: read` is required and is included in the `write` the
      # job already has — in a job scoped to `contents: read` alone this step
      # 403s, and a local `gh` session will not reproduce that.
      #
      # Reviewing a fork on purpose is `examples/review-fork.yml`, which uses
      # `pull_request_target` and a label. It is a different trust model and
      # belongs in a different file.
      - name: Refuse a fork
        if: >-
          github.event_name == 'issue_comment' ||
          github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number || github.event.inputs.pr }}
        shell: bash
        run: |
          head="$(gh api "repos/$REPO/pulls/$NUMBER" --jq '.head.repo.full_name')"
          if [ "$head" != "$REPO" ]; then
            echo "::error title=Not reviewed::#$NUMBER comes from $head.             Reviewing a fork needs examples/review-fork.yml."
            exit 1
          fi

      # Not for the action — that is pulled from the marketplace — but for the
      # models. This is the tree they read when a finding depends on code the
      # diff does not contain. See review-vertex.yml for why the ref is given
      # explicitly rather than left to default.
      - uses: actions/checkout@v4
        with:
          ref: >-
            refs/pull/${{ github.event.pull_request.number
              || github.event.issue.number
              || github.event.inputs.pr }}/merge
          fetch-depth: 2
          persist-credentials: false

      # `continue-on-error` because the App is an improvement, not a
      # requirement: a revoked installation or an expired key should degrade
      # the review to GITHUB_TOKEN rather than stop it.
      - name: Mint a token from the App
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # `continue-on-error` reports the step as *successful* whatever happened,
      # so a mint that failed is invisible in the run summary — which is how an
      # App that was created and configured but never installed on the
      # repository went unnoticed: secrets set, step green, comments still from
      # github-actions, and the reason four hundred lines into a log.
      #
      # `outcome` is the real result. `conclusion` is the one continue-on-error
      # rewrites.
      - name: Say so if the App token could not be minted
        if: steps.app-token.outcome == 'failure'
        shell: bash
        run: >-
          echo "::warning title=Falling back to GITHUB_TOKEN::The App token
          could not be minted, so this review runs with GITHUB_TOKEN and posts
          as github-actions. The usual cause is an App that exists but is not
          installed on this repository."

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          project_id: ${{ secrets.GOOGLE_CLOUD_PROJECT }}

      - name: Review
        uses: yuting0624/quorum-review@v1
        with:
          google-cloud-project: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          skill: security-review
          # The same three-way fallback as every other reference to the
          # number in this file. It is not needed — an empty value is unset by
          # action.yml and the reviewer derives the number from the payload —
          # but the asymmetry was a false-positive magnet: four independent
          # model reviews read the single-source version as "silently broken
          # on every trigger except dispatch". They could not check, because
          # the code that makes it safe is in the action's repository and not
          # in the checkout their tools can read.
          pr-number: ${{ github.event.pull_request.number
              || github.event.issue.number
              || github.event.inputs.pr }}
