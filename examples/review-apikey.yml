# Try-it-out setup: two vendor API keys, no Google Cloud project.
#
# Compare this with review-vertex.yml. Here there are two long-lived secrets
# from two vendors, on two bills, under two sets of terms — and both live in the
# repository's secret store. That contrast is the point the project is making;
# see docs/architecture.md.

name: quorum-review (API keys)

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Review
        uses: ./
        with:
          mode: direct
          skill: security-review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
