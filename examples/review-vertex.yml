# Recommended setup: one Google Cloud credential drives both models.
#
# There is no long-lived secret in this workflow. The GitHub OIDC token is
# exchanged for short-lived Google Cloud credentials, and both Gemini and Claude
# authenticate off those same Application Default Credentials.
#
# This uses Direct Workload Identity Federation — the workflow's own federated
# identity holds the IAM role, with no service account to impersonate. One fewer
# identity to manage, and nothing that can be given a key.
#
# Prerequisites are in docs/setup-vertex.md — in particular, Claude must be
# enabled in Vertex AI Model Garden for the project, or every Claude call comes
# back 404 while the Gemini half keeps working.

name: quorum-review

on:
  pull_request:
    # Add `synchronize` to review every push, not just the first. It is not the
    # default only because it is your money: with `incremental: on` a re-review
    # reads the range since the last one rather than the whole pull request, and
    # the ledger suppresses anything already reported, so the marginal cost of a
    # push is roughly the size of that push. On a branch that gets twenty
    # commits, that is the difference between reviewing it once and reviewing
    # what actually changed.
    #
    # There is no feedback loop to worry about here — this action never pushes.
    # The `concurrency` block below cancels a superseded run, so a rapid series
    # of pushes costs one review rather than one per commit.
    types: [opened, reopened]
  issue_comment:
    types: [created]
  # Replying "@quorum wontfix" to a review comment retires that finding.
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to review
        required: true

# One review at a time per pull request. Without this, a reopen or a quick
# follow-up comment starts an overlapping run, and two runs racing to edit the
# same summary comment can lose the ledger the other just wrote.
concurrency:
  group: >-
    quorum-review-${{ github.event.pull_request.number
      || github.event.issue.number
      || github.event.inputs.pr }}
  cancel-in-progress: true

# `contents: read` covers reading the diff. `id-token: write` is what lets the
# workflow mint the OIDC token for federation — without it, auth fails before
# any model is called.
#
# Note that `permissions:` only governs GITHUB_TOKEN. If you switch to a GitHub
# App token, the effective permissions are the App installation's instead.
# `security-events: write` and `actions: read` are only for the SARIF upload at
# the end. `actions: read` is what codeql-action needs to read the workflow run
# on a private repository; without it the upload fails with "Resource not
# accessible by integration".
#
# Note also that uploading to code scanning on a *private* repository requires
# GitHub Advanced Security. It is free on public ones. Drop the upload step and
# these two permissions if neither applies — the findings are still in the pull
# request and the job summary.
permissions:
  contents: read
  id-token: write
  pull-requests: write
  security-events: write
  actions: read

jobs:
  review:
    # Run on a new pull request, on manual dispatch, when someone comments
    # `@quorum /review`, or when they reply `@quorum wontfix` to a finding.
    #
    # Three conditions here are load-bearing:
    #
    # - Forks are excluded here. They get a read-only token and no secrets, so
    #   this workflow could only fail on them — noisily, on every outside
    #   contribution. Reviewing them needs `pull_request_target`, which is a
    #   different trust model and belongs in its own file: see
    #   examples/review-fork.yml, and read its header before deploying it.
    #
    # - The Bot check prevents a loop: without it the comments this action
    #   posts re-trigger the workflow, which posts more comments.
    #
    # - author_association is a cheap pre-filter, not the authorisation
    #   boundary. It cannot distinguish a read-only collaborator from one with
    #   write access, so anything acting on a user's instruction re-checks the
    #   real permission against the API.
    if: >-
      github.event.pull_request.head.repo.fork != true &&
      (github.event_name == 'pull_request' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request_review_comment' &&
        github.event.comment.user.type != 'Bot' &&
        contains(github.event.comment.body, '@quorum') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
                 github.event.comment.author_association)) ||
       (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        (contains(github.event.comment.body, '@quorum /review') ||
         contains(github.event.comment.body, '@quorum /criteria')) &&
        github.event.comment.user.type != 'Bot' &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
                 github.event.comment.author_association)))
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # The checkout is what the models read beyond the diff — the validator a
      # changed line calls, the registry an action has to be listed in. It has
      # to be the pull request's code.
      #
      # On a `pull_request` event that is the default. On `issue_comment` it is
      # not: that event checks out the default branch, so the reference is
      # given explicitly. `fetch-depth: 2` keeps the head commit itself in the
      # clone, which is how the reviewer confirms at run time that it is
      # reading the right tree; without it, the tools are withdrawn and the
      # summary says the review was diff-only.
      #
      # Pin third-party actions to a commit rather than a tag when the token
      # in scope matters to you: a tag can be moved to point at new code.
      - uses: actions/checkout@v4
        with:
          ref: >-
            refs/pull/${{ github.event.pull_request.number
              || github.event.issue.number
              || github.event.inputs.pr }}/merge
          fetch-depth: 2

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          project_id: ${{ secrets.GOOGLE_CLOUD_PROJECT }}

      - name: Review
        id: review
        uses: yuting0624/quorum-review@v1
        with:
          mode: vertex
          google-cloud-project: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          # A bare name is a built-in. A path is read from *your* repository,
          # so your own standards do not require forking this one:
          #   skill: security-review, .github/quorum/backend.md
          skill: security-review
          pr-number: ${{ github.event.inputs.pr }}
          sarif-file: quorum.sarif
          # Uncomment to make this a required check. Advisory and refuted
          # findings never gate — the reviewer declined to stand behind them.
          # fail-on: critical

      # Puts the findings in the Security tab, where they dedupe across runs,
      # track open-to-fixed, and go through the triage the organisation already
      # has. `always()` so a failed gate still uploads what it failed on.
      - name: Upload to code scanning
        if: always() && hashFiles('quorum.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: quorum.sarif
          category: quorum-review
