# Moves the `v1` alias when a version tag is pushed.
#
# This exists because of a failure, not a preference. `v1` sat 38 commits
# behind main while the README told everyone to use it — so the documented
# install path shipped code without the repository-access feature the README
# measures, and without two security fixes to the trigger conditions. The one
# repository that had adopted it was running the vulnerable version.
#
# A moving major-version alias is the GitHub Actions convention, and the danger
# people warn about is a tag moved to point at *new* code. A tag left pointing
# at old code is the same hazard wearing the opposite face, and it is quieter:
# nothing fails, the workflow keeps passing, and the fixes simply never arrive.
#
# So the alias is not maintained by hand. Push `v0.2.0`, and `v1` follows.
#
#     git tag -a v0.2.0 -m "..." && git push origin v0.2.0

name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  alias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The tag has to match what the package reports
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared=$(python -c "import re,pathlib; \
            print(re.search(r'__version__ = \"([^\"]+)\"', \
            pathlib.Path('quorum_review/__init__.py').read_text()).group(1))")
          if [ "$tagged" != "$declared" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match __version__ $declared"
            echo "A release whose artefacts disagree about their own version is"
            echo "worse than no release: every finding it produces is stamped"
            echo "with a number that does not identify the code that made it."
            exit 1
          fi

      - name: Move the major-version alias
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/$major"
          echo "::notice::$major now points at $GITHUB_REF_NAME ($GITHUB_SHA)"
