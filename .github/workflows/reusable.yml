# Org-wide rollout: one copy of the policy, N repositories calling it.
#
# Adopting this by copying review-vertex.yml means ninety lines of YAML in every
# repository, and every subsequent fix to the trigger conditions has to be
# copied again — including the two security fixes this project has already made
# to those conditions. Neither would have reached a repository that copied the
# file in January.
#
# So the conditions live here, once. A repository that uses it needs five lines:
#
#     # .github/workflows/review.yml
#     name: quorum-review
#     on:
#       pull_request:
#         types: [opened, reopened, synchronize]
#       issue_comment:
#         types: [created]
#       pull_request_review_comment:
#         types: [created]
#     jobs:
#       review:
#         uses: your-org/quorum-review/.github/workflows/reusable.yml@v1
#         secrets: inherit
#
# Two things a caller cannot skip:
#
# - `on:` must be declared by the caller. GitHub resolves triggers from the
#   calling workflow, not the called one, so a reusable workflow cannot decide
#   when it runs. The `if:` below still governs whether the job does anything.
# - `secrets: inherit`, or pass WIF_PROVIDER and GOOGLE_CLOUD_PROJECT
#   explicitly. Organisation-level secrets make `inherit` the usual choice.
#
# Forks are not handled here: they need `pull_request_target`, which is a
# different trust model and a different file. See examples/review-fork.yml.

name: quorum-review (reusable)

on:
  workflow_call:
    inputs:
      skill:
        type: string
        required: false
        default: security-review
      scan:
        type: string
        required: false
        default: both
      verification:
        type: string
        required: false
        default: "on"
      repo-access:
        type: string
        required: false
        default: "on"
      incremental:
        type: string
        required: false
        default: "on"
      inline-severity:
        type: string
        required: false
        default: low
      fail-on:
        description: >-
          critical / high / medium / low to make this a required check.
          Defaults to never, so adopting the workflow cannot start blocking
          merges in someone's repository without them asking for it.
        type: string
        required: false
        default: never
      fail-on-degraded:
        type: string
        required: false
        default: "false"
      exclude:
        type: string
        required: false
        default: ""
      review-language:
        type: string
        required: false
        default: ""
      primary-model:
        type: string
        required: false
        default: ""
      verifier-model:
        type: string
        required: false
        default: ""
      max-diff-characters:
        type: string
        required: false
        default: "400000"
      runs-on:
        description: A self-hosted label, if model calls have to leave from a known network.
        type: string
        required: false
        default: ubuntu-latest
      action-ref:
        description: >-
          Which version of the action to run — a tag or a commit SHA. Pin it to
          a SHA in a regulated environment; a tag can be moved to point at new
          code. This is a git ref rather than `owner/repo@ref`, because the
          action is checked out rather than referenced: see the Review step.
        type: string
        required: false
        default: v1
      action-repository:
        description: >-
          Where to fetch the action from. Only needed if you run a fork.
        type: string
        required: false
        default: yuting0624/quorum-review
      vertex-region:
        description: >-
          Pin both models to one Vertex region, for data residency. Empty uses
          the `global` endpoint, which routes to whichever region has capacity
          and is therefore not a residency guarantee.
        type: string
        required: false
        default: ""
      sarif-file:
        description: >-
          Where to write the SARIF log. Empty disables the upload, which is
          what you want without GitHub Advanced Security.
        type: string
        required: false
        default: quorum.sarif
    secrets:
      WIF_PROVIDER:
        required: true
      GOOGLE_CLOUD_PROJECT:
        required: true
    outputs:
      findings:
        value: ${{ jobs.review.outputs.findings }}
      critical:
        value: ${{ jobs.review.outputs.critical }}
      high:
        value: ${{ jobs.review.outputs.high }}
      degraded:
        value: ${{ jobs.review.outputs.degraded }}

concurrency:
  group: >-
    quorum-review-${{ github.repository }}-${{ github.event.pull_request.number
      || github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  pull-requests: write
  # Only for the SARIF upload. `actions: read` is what codeql-action needs to
  # read the workflow run on a private repository; without it the upload fails
  # with "Resource not accessible by integration". Both were missing here while
  # the file also had a step that GitHub could not parse, so the upload had
  # never been reached to fail.
  security-events: write
  actions: read

jobs:
  review:
    # The conditions this file exists to centralise. Every one is load-bearing:
    #
    # - Forks are excluded. They get a read-only token and no secrets, so this
    #   would only fail, noisily, on every outside contribution.
    # - The Bot check prevents a loop: without it, the comments this action
    #   posts satisfy the trigger and start another run.
    # - author_association is a cheap pre-filter, not the authorisation
    #   boundary. It cannot tell a read-only collaborator from a maintainer, so
    #   the action re-checks the real permission against the API.
    if: >-
      github.event.pull_request.head.repo.fork != true &&
      (github.event_name == 'pull_request' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request_review_comment' &&
        github.event.comment.user.type != 'Bot' &&
        contains(github.event.comment.body, '@quorum') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
                 github.event.comment.author_association)) ||
       (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        (contains(github.event.comment.body, '@quorum /criteria') ||
         (contains(github.event.comment.body, '@quorum /review') &&
          github.event.issue.state == 'open')) &&
        github.event.comment.user.type != 'Bot' &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
                 github.event.comment.author_association)))
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 25

    outputs:
      findings: ${{ steps.review.outputs.findings }}
      critical: ${{ steps.review.outputs.critical }}
      high: ${{ steps.review.outputs.high }}
      degraded: ${{ steps.review.outputs.degraded }}

    steps:
      # The action itself, checked out rather than referenced.
      #
      # `uses:` cannot take an expression at step level. This file used to say
      # `uses: ${{ inputs.action-ref }}`, which GitHub cannot parse at all — so
      # it never registered the workflow's name, and every push produced a
      # failed run titled "no jobs were run". The org-wide rollout path this
      # file exists to be had never worked, and said nothing about it.
      #
      # Checking the action out keeps the version an input: `ref:` does take an
      # expression, and `uses: ./` is a literal.
      - name: Fetch the reviewer
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.action-repository }}
          ref: ${{ inputs.action-ref }}
          persist-credentials: false

      # The pull request's code, as data — what the models read when a finding
      # depends on something the diff does not contain. Into `pr-head`, so it
      # cannot be confused with the action's own checkout above; the action is
      # pointed at it explicitly with `workspace-path`.
      #
      # The ref is given explicitly because an `issue_comment` run would
      # otherwise check out the default branch and review the wrong tree.
      # `fetch-depth: 2` keeps the head commit in the clone, which is how the
      # reviewer confirms at run time that it has the right one.
      #
      # `/merge` is preferred: it is the branch merged into base, which is what
      # the diff describes. It does not exist for a pull request with
      # conflicts, so `/head` is the fallback — a review of a conflicted branch
      # is still worth having.
      - uses: actions/checkout@v4
        id: merge-ref
        continue-on-error: true
        with:
          ref: >-
            refs/pull/${{ github.event.pull_request.number
              || github.event.issue.number }}/merge
          path: pr-head
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/checkout@v4
        if: steps.merge-ref.outcome == 'failure'
        with:
          ref: >-
            refs/pull/${{ github.event.pull_request.number
              || github.event.issue.number }}/head
          path: pr-head
          fetch-depth: 1
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          project_id: ${{ secrets.GOOGLE_CLOUD_PROJECT }}

      - name: Review
        id: review
        uses: ./
        with:
          mode: vertex
          google-cloud-project: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          workspace-path: ${{ github.workspace }}/pr-head
          sarif-file: ${{ inputs.sarif-file }}
          skill: ${{ inputs.skill }}
          scan: ${{ inputs.scan }}
          verification: ${{ inputs.verification }}
          repo-access: ${{ inputs.repo-access }}
          incremental: ${{ inputs.incremental }}
          inline-severity: ${{ inputs.inline-severity }}
          fail-on: ${{ inputs.fail-on }}
          fail-on-degraded: ${{ inputs.fail-on-degraded }}
          exclude: ${{ inputs.exclude }}
          review-language: ${{ inputs.review-language }}
          primary-model: ${{ inputs.primary-model }}
          verifier-model: ${{ inputs.verifier-model }}
          max-diff-characters: ${{ inputs.max-diff-characters }}
          vertex-region: ${{ inputs.vertex-region }}

      # `always()` so a failed gate still uploads what it failed on. Skipped
      # without GitHub Advanced Security, where the upload is rejected and the
      # findings stay in the pull request comments.
      - name: Upload SARIF
        if: always() && inputs.sarif-file != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ inputs.sarif-file }}
          category: quorum-review
