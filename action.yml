name: quorum-review
description: Cross-model pull request review on Google Cloud.
author: quorum-review contributors

branding:
  icon: check-square
  color: gray-dark

inputs:
  mode:
    description: >-
      'vertex' runs both models on one Google Cloud credential. 'direct' uses an
      AI Studio key plus an Anthropic key.
    required: false
    default: vertex
  skill:
    description: Review criteria to load from skills/<name>/SKILL.md.
    required: false
    default: security-review
  primary-model:
    description: >-
      Model that scans the diff. Leave unset for the built-in default. Set this
      to a Claude ID and verifier-model to a Gemini ID to reverse the roles.
    required: false
    default: ""
  verifier-model:
    description: Model that judges each finding independently.
    required: false
    default: ""
  review-language:
    description: >-
      Human language for finding prose, e.g. 'Japanese'. Defaults to English.
    required: false
    default: ""
  google-cloud-project:
    description: Google Cloud project ID. Required in vertex mode.
    required: false
    default: ""
  claude-vertex-region:
    description: >-
      Vertex region for Claude. 'global' is recommended; try 'us-east5' if your
      Model Garden entitlement is region-scoped.
    required: false
    default: global
  github-token:
    description: Token used to read the diff and post comments.
    required: false
    default: ${{ github.token }}
  pr-number:
    description: >-
      Pull request to review. Normally inferred from the event; set this for
      workflow_dispatch, which carries no pull request in its payload.
    required: false
    default: ""
  exclude:
    description: >-
      Extra paths to leave unreviewed, as gitignore-style globs, one per line
      or comma-separated. Added to a built-in list covering lockfiles, vendored
      code, build output, and generated sources. A .quorumignore file at the
      repository root is read as well.
    required: false
    default: ""
  incremental:
    description: >-
      'on' re-reviews only what changed since the last review, using the sha
      recorded in the ledger. Saves grow with every push. 'off' always reads
      the whole pull request.
    required: false
    default: "on"
  scan:
    description: >-
      'both' has each model read the diff independently and merges the results.
      'single' uses only primary-model. Scanning with both is what raises
      recall — a second opinion can only judge findings that were reported, so
      one model scanning alone caps what the review can ever find.
    required: false
    default: both
  verification:
    description: >-
      'on' asks the other model to judge any finding only one model reported.
      Findings both models reported independently are already agreed and cost
      no extra call. 'off' posts everything unchecked — cheaper, more false
      positives.
    required: false
    default: "on"
  repo-access:
    description: >-
      'on' lets the models read files outside the diff with three read-only
      tools, so a finding that turns on a validator, a permission registry or a
      function signature can be settled instead of guessed. Requires
      actions/checkout of the pull request's head; without one the review
      silently stays diff-only and the summary says so. 'off' reviews the diff
      alone, which is cheaper and measurably blinder.
    required: false
    default: "on"
  verify-tool-calls:
    description: >-
      Tool calls one verification may make, when repo-access is on. Kept well
      below the scanning budget because a verifier is settling one claim, and
      is called once per finding.
    required: false
    default: "6"
  inline-severity:
    description: >-
      Lowest severity that gets its own comment in the diff view: critical,
      high, medium, or low. Everything still appears in the summary — this only
      decides what interrupts the reader. A dozen simultaneous comments on one
      pull request is how a reviewer gets muted.
    required: false
    default: low
  max-verified-findings:
    description: >-
      Cap on how many unresolved findings reach a second opinion, highest
      severity first. Ignored when verification is off.
    required: false
    default: "20"
  workspace-path:
    description: >-
      Where the code under review is checked out, when that is not the
      workspace root. Needed for fork reviews, where the fork's code goes in a
      subdirectory so that nothing from it can be mistaken for this
      repository's own files. See examples/review-fork.yml.
    required: false
    default: ""
  fork-label:
    description: >-
      Label that authorises reviewing a pull request from a fork. The action
      also checks that whoever applied it has write access — labelling is
      available to triage collaborators, so the label alone is not
      authorisation. Fork pull requests without it are skipped, not failed.
    required: false
    default: "quorum: review"
  max-diff-characters:
    description: >-
      Cap on the whole diff sent for review, on top of the 20,000-character
      per-file limit. A dependency bump can touch four hundred files that each
      pass the per-file limit comfortably. Files that do not fit are named in
      the summary and the run is marked degraded — they are not quietly
      reviewed as if they had been.
    required: false
    default: "400000"
  fail-on:
    description: >-
      Exit non-zero when a finding at or above this severity is posted, so the
      action can be a required check: critical, high, medium, or low. Default
      'never' always exits 0. Advisory and refuted findings never gate — the
      reviewer declined to stand behind them.
    required: false
    default: never
  fail-on-degraded:
    description: >-
      Also fail when the review could not run properly — a model down, files
      over the diff budget. Off by default, and that default is a judgement
      call: a required check that passes because the reviewer was broken is
      worse than no check, but blocking every merge in the organisation because
      one Vertex region is having a bad afternoon is its own outage.
    required: false
    default: "false"
  dry-run:
    description: Print the summary instead of posting it.
    required: false
    default: "false"

outputs:
  findings:
    description: Findings posted as real — confirmed plus, if verification is off, unchecked.
    value: ${{ steps.review.outputs.findings }}
  critical:
    description: How many of them are critical.
    value: ${{ steps.review.outputs.critical }}
  high:
    description: How many are high.
    value: ${{ steps.review.outputs.high }}
  medium:
    description: How many are medium.
    value: ${{ steps.review.outputs.medium }}
  low:
    description: How many are low.
    value: ${{ steps.review.outputs.low }}
  advisory:
    description: Findings the second opinion could not settle either way.
    value: ${{ steps.review.outputs.advisory }}
  refuted:
    description: Findings the second opinion rejected.
    value: ${{ steps.review.outputs.refuted }}
  resolved:
    description: Previously open findings this run no longer reports.
    value: ${{ steps.review.outputs.resolved }}
  degraded:
    description: >-
      'true' when the review saw less than it was configured to see. Branch on
      this before treating a clean result as a clean result.
    value: ${{ steps.review.outputs.degraded }}
  repo-access:
    description: Whether the models could read past the diff, and why not if they could not.
    value: ${{ steps.review.outputs['repo-access'] }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install quorum-review
      shell: bash
      run: python -m pip install --quiet "${{ github.action_path }}"

    - name: Review
      id: review
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        QUORUM_MODE: ${{ inputs.mode }}
        REVIEW_SKILL: ${{ inputs.skill }}
        PRIMARY_MODEL: ${{ inputs.primary-model }}
        VERIFIER_MODEL: ${{ inputs.verifier-model }}
        REVIEW_LANGUAGE: ${{ inputs.review-language }}
        GOOGLE_CLOUD_PROJECT: ${{ inputs.google-cloud-project }}
        CLAUDE_VERTEX_REGION: ${{ inputs.claude-vertex-region }}
        QUORUM_EXCLUDE: ${{ inputs.exclude }}
        QUORUM_INCREMENTAL: ${{ inputs.incremental }}
        QUORUM_SCAN: ${{ inputs.scan }}
        QUORUM_VERIFICATION: ${{ inputs.verification }}
        QUORUM_REPO_ACCESS: ${{ inputs.repo-access }}
        QUORUM_VERIFY_TOOL_CALLS: ${{ inputs.verify-tool-calls }}
        QUORUM_INLINE_SEVERITY: ${{ inputs.inline-severity }}
        MAX_VERIFIED_FINDINGS: ${{ inputs.max-verified-findings }}
        QUORUM_WORKSPACE: ${{ inputs.workspace-path }}
        QUORUM_FORK_LABEL: ${{ inputs.fork-label }}
        QUORUM_MAX_DIFF_CHARS: ${{ inputs.max-diff-characters }}
        QUORUM_FAIL_ON: ${{ inputs.fail-on }}
        QUORUM_FAIL_ON_DEGRADED: ${{ inputs.fail-on-degraded }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        QUORUM_PR_NUMBER: ${{ inputs.pr-number }}
      run: |
        # Empty inputs must not shadow a default set inside the code.
        for name in PRIMARY_MODEL VERIFIER_MODEL REVIEW_LANGUAGE QUORUM_PR_NUMBER; do
          if [ -z "${!name}" ]; then unset "$name"; fi
        done
        python -m quorum_review.review ${{ inputs.dry-run == 'true' && '--dry-run' || '' }}
